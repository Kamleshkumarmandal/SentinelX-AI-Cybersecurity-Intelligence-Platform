services:
  api:
    build: ./backend
    environment:
      DATABASE_URL: sqlite:////data/sentinelx.db
      SECRET_KEY: ${SECRET_KEY:-replace-this-local-development-secret-before-deployment}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@sentinelx.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeMe123!}
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    volumes:
      - sentinelx_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
  dashboard:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000/api
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy
volumes:
  sentinelx_data:
